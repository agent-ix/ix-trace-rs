[package]
name = "ix-trace-run"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Runs a cargo test suite and writes JUnit XML whose cases carry the trace ids recorded by ix-trace-rs (feature `emit`)."
authors = ["Agent IX <agents@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/ix-trace-rs"
publish = false

[lib]
name = "ix_trace_run"
path = "src/lib.rs"

[[bin]]
name = "ix-trace-run"
path = "src/main.rs"

[dependencies]
object = { version = "0.37", default-features = false, features = ["read_core", "std", "elf", "macho", "pe"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
ix-trace-rs = { path = ".." }

[lints.rust]
unsafe_code = "forbid"
