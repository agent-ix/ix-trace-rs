[package]
name = "ix-trace-rs"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "Compile-checked #[trace(...)] and #[implements(...)] markers and the argument-free #[string_edge] marker for statically parseable spec traceability (quire-rs FR-051). Zero runtime dependencies."
authors = ["Agent IX <agents@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/ix-trace-rs"

[lib]
name = "ix_trace_rs"
path = "src/lib.rs"
proc-macro = true

[dependencies]

[dev-dependencies]
trybuild = "1.0.111"

[features]
# Embed a trace record per `#[trace]` fn item for the `ix-trace-run` runner.
# Off by default; the expansion is then the unchanged item (FR-005).
emit = []

[workspace]
members = ["ix-trace-run"]

[profile.release]
lto = "thin"
codegen-units = 1
