[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Our own crate is AGPL-3.0-or-later (the project license); allow it here
# WITHOUT permitting AGPL in third-party dependencies — the allow-list above
# stays permissive-only. Mirrors the quire-rs deny.toml.
#
# Adopters pay a one-line cost for this: quire-rs and its siblings allow AGPL
# for their own crate alone, so each must add the same exception for
# `ix-trace-rs` before taking the dev-dependency. That trade was weighed and
# accepted — the project licenses uniformly and this crate is not carved out.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "ix-trace-rs" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
