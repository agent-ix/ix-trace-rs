[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# No AGPL exception here, unlike the sibling repos. This crate is
# MIT OR Apache-2.0 (see README) precisely so that adopting it costs a consumer
# no deny.toml edit: quire-rs and its siblings allow AGPL for their own crate
# only and keep this list permissive-only, so an AGPL marker crate would have
# failed their licenses gate. The allow-list above already covers this crate.
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
